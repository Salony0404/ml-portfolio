apiVersion: v1
kind: Service
metadata:
  name: kafka-neo4j-connector-service
spec:
  selector:
    app: kafka-neo4j-connector
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-neo4j-connector-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-neo4j-connector
  template:
    metadata:
      labels:
        app: kafka-neo4j-connector
    spec:
      containers:
        - name: kafka-neo4j-connector
          # For Windows / Docker Desktop (amd64):
          image: change1472/cse511-kafka-neo4j-connector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            # Kafka inside the cluster
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:29092"

            # Neo4j inside the cluster
            - name: NEO4J_URI
              value: "bolt://neo4j-release:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: "processingpipeline"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
